name: Skill Memory CI

on:
  pull_request:
    paths:
      - 'src/strategies/skill_memory.py'
      - 'tests/test_skill_memory*.py'
      - 'experiments/analyze_skill_memory_audit.py'
      - '.github/workflows/skill-memory-ci.yml'
  push:
    branches:
      - feature/skill-memory-statistical-study
    paths:
      - 'src/strategies/skill_memory.py'
      - 'tests/test_skill_memory*.py'
      - 'experiments/analyze_skill_memory_audit.py'
      - '.github/workflows/skill-memory-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Skill Memory tests
        run: python -m pytest -q tests/test_skill_memory.py tests/test_skill_memory_scoring.py
