benchmark:
  factory_args:
    return_task_id: false
    shuffle: true
    class_ids_from_zero_in_each_exp: false
    class_ids_from_zero_from_first_exp: true
    benchmark_name: split_cifar100
    n_experiences: 20
    val_size: 0.05
    use_transforms: true
    fixed_class_order: null
  dataset_name: cifar100
  dataset_root: ${hydra:runtime.cwd}/data
scheduler:
  type: null
optimizer:
  type: SGD
  lr: 0.1
  momentum: 0.0
  weight_decay: 0.0
model:
  model_type: slim_resnet18
strategy:
  mem_size: 2000
  batch_size_mem: null
  train_mb_size: 10
  eval_mb_size: 128
  train_epochs: 3
  device: cpu
  use_task_boundaries: true
  name: skill_memory
  max_skills: 20
  probe_samples: 64
  reuse_threshold: 0.9
  clone_threshold: 0.3
evaluation:
  peval_mode: experience
  parallel_evaluation: false
  eval_every: -1
  metrics:
  - accuracy_metrics
  - cumulative_accuracy
  - loss_metrics
  - clock
  - time
  loggers_strategy:
  - interactive
  - text
  - tensorboard
  - json
  num_gpus: 0.15
  num_cpus: 1
  num_actors: 3
experiment:
  results_root: ${hydra:runtime.cwd}/results
  seed: 4
  save_models: false
  train_online: true
  logdir: /home/kobros-tech/workspace/AI/ocl_survey/results/skill_memory_split_cifar100_20_2000/4
  debug: false
